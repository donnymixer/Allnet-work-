name: Build Allnet-work APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36"

      - name: Extract Android project
        run: |
          mkdir -p build-src
          unzip -o AllnetWorkAndroid_v6_Audited_Fixed.zip -d build-src

      - name: Build APK
        run: |
          gradle -p build-src assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Allnet-work-APK
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
